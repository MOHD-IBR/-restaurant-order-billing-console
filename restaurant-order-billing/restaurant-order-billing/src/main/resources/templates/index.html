<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Order & Billing Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Restaurant Console</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/menu">Menu</a>
            <a class="nav-link" href="/orders">Orders</a>
            <a class="nav-link" href="/orders/new">New Order</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-5">Restaurant Order & Billing Console</h1>
        <p class="lead text-muted">Manage menu, take orders and generate bills easily</p>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <i class="bi bi-card-list display-4 text-primary"></i>
                    <h4 class="mt-3">Menu Items</h4>
                    <p class="display-6" th:text="${menuCount}">0</p>
                    <a href="/menu" class="btn btn-outline-primary">Manage Menu</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <i class="bi bi-receipt display-4 text-success"></i>
                    <h4 class="mt-3">Total Orders</h4>
                    <p class="display-6" th:text="${orderCount}">0</p>
                    <a href="/orders" class="btn btn-outline-success">View Orders</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center">
                    <i class="bi bi-plus-circle display-4 text-warning"></i>
                    <h4 class="mt-3">New Order</h4>
                    <p class="text-muted">Create a new customer order</p>
                    <a href="/orders/new" class="btn btn-warning">Take Order</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 mb-3 text-muted">
    <small>Restaurant Order & Billing Console - EAD Project</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
