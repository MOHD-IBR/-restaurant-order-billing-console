<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Restaurant Console</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/menu">Menu</a>
            <a class="nav-link" href="/orders">Orders</a>
            <a class="nav-link active" href="/orders/new">New Order</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Create New Order</h2>

    <div th:if="${param.error}" class="alert alert-danger">
        Please select at least one item.
    </div>

    <form action="/orders/new" method="post">
        <div class="row mb-4">
            <div class="col-md-6">
                <label class="form-label">Customer Name</label>
                <input type="text" name="customerName" class="form-control" required placeholder="Enter customer name">
            </div>
            <div class="col-md-6">
                <label class="form-label">Table Number</label>
                <input type="text" name="tableNumber" class="form-control" required placeholder="e.g. T-05">
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">
                <h5 class="mb-0">Select Items</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Item</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${menuItems}">
                        <td th:text="${item.name}"></td>
                        <td th:text="${item.category}"></td>
                        <td th:text="${'Rs. ' + item.price}"></td>
                        <td style="width: 120px;">
                            <input type="number" th:name="'qty_' + ${item.id}"
                                   class="form-control" min="0" value="0">
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(menuItems)}">
                        <td colspan="4" class="text-center text-muted">
                            No menu items available. Please add items from Menu section first.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success btn-lg">Generate Bill</button>
            <a href="/orders" class="btn btn-secondary btn-lg">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
