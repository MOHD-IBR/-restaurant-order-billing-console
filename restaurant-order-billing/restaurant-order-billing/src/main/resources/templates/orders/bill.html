<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark no-print">
    <div class="container">
        <a class="navbar-brand" href="/">Restaurant Console</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/menu">Menu</a>
            <a class="nav-link" href="/orders">Orders</a>
            <a class="nav-link" href="/orders/new">New Order</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h3>Restaurant Bill</h3>
                        <p class="text-muted mb-0">Thank you for dining with us!</p>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <strong>Order ID:</strong> <span th:text="${order.id}"></span><br>
                            <strong>Customer:</strong> <span th:text="${order.customerName}"></span><br>
                            <strong>Table:</strong> <span th:text="${order.tableNumber}"></span>
                        </div>
                        <div class="col-6 text-end">
                            <strong>Date:</strong>
                            <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></span>
                        </div>
                    </div>

                    <hr>

                    <table class="table">
                        <thead>
                        <tr>
                            <th>Item</th>
                            <th class="text-center">Qty</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td th:text="${item.itemName}"></td>
                            <td class="text-center" th:text="${item.quantity}"></td>
                            <td class="text-end" th:text="${'Rs. ' + #numbers.formatDecimal(item.price, 1, 2)}"></td>
                            <td class="text-end" th:text="${'Rs. ' + #numbers.formatDecimal(item.total, 1, 2)}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <hr>

                    <div class="row">
                        <div class="col-6"></div>
                        <div class="col-6">
                            <table class="table table-sm table-borderless">
                                <tr>
                                    <td>Subtotal:</td>
                                    <td class="text-end" th:text="${'Rs. ' + #numbers.formatDecimal(order.subtotal, 1, 2)}"></td>
                                </tr>
                                <tr>
                                    <td>Tax (5%):</td>
                                    <td class="text-end" th:text="${'Rs. ' + #numbers.formatDecimal(order.tax, 1, 2)}"></td>
                                </tr>
                                <tr class="fw-bold fs-5">
                                    <td>Grand Total:</td>
                                    <td class="text-end" th:text="${'Rs. ' + #numbers.formatDecimal(order.grandTotal, 1, 2)}"></td>
                                </tr>
                            </table>
                        </div>
                    </div>

                    <div class="text-center mt-4 no-print">
                        <button onclick="window.print()" class="btn btn-primary">Print Bill</button>
                        <a href="/orders/new" class="btn btn-success">New Order</a>
                        <a href="/orders" class="btn btn-secondary">Back to Orders</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
