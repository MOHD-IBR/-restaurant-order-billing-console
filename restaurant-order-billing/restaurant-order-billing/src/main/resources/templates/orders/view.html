<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Restaurant Console</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/menu">Menu</a>
            <a class="nav-link active" href="/orders">Orders</a>
            <a class="nav-link" href="/orders/new">New Order</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between">
                    <h4 class="mb-0">Order Details</h4>
                    <a th:href="@{/orders/bill/{id}(id=${order.id})}" class="btn btn-sm btn-primary">View Bill</a>
                </div>
                <div class="card-body">
                    <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
                    <p><strong>Customer:</strong> <span th:text="${order.customerName}"></span></p>
                    <p><strong>Table:</strong> <span th:text="${order.tableNumber}"></span></p>
                    <p><strong>Date:</strong>
                        <span th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></span>
                    </p>
                    <p><strong>Status:</strong>
                        <span class="badge bg-success" th:text="${order.status}"></span>
                    </p>

                    <h5 class="mt-4">Items</h5>
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td th:text="${item.itemName}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${'Rs. ' + #numbers.formatDecimal(item.price, 1, 2)}"></td>
                            <td th:text="${'Rs. ' + #numbers.formatDecimal(item.total, 1, 2)}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="text-end">
                        <p>Subtotal: <strong th:text="${'Rs. ' + #numbers.formatDecimal(order.subtotal, 1, 2)}"></strong></p>
                        <p>Tax (5%): <strong th:text="${'Rs. ' + #numbers.formatDecimal(order.tax, 1, 2)}"></strong></p>
                        <p class="fs-5">Grand Total:
                            <strong th:text="${'Rs. ' + #numbers.formatDecimal(order.grandTotal, 1, 2)}"></strong>
                        </p>
                    </div>

                    <a href="/orders" class="btn btn-secondary">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
