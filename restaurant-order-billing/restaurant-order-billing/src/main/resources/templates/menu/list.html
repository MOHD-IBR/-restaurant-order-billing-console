<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Restaurant Console</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link active" href="/menu">Menu</a>
            <a class="nav-link" href="/orders">Orders</a>
            <a class="nav-link" href="/orders/new">New Order</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Menu Items</h2>
        <a href="/menu/add" class="btn btn-primary">+ Add New Item</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Available</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${menuItems}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${item.name}"></td>
                    <td th:text="${item.category}"></td>
                    <td th:text="${'Rs. ' + item.price}"></td>
                    <td>
                        <span th:if="${item.available}" class="badge bg-success">Yes</span>
                        <span th:unless="${item.available}" class="badge bg-secondary">No</span>
                    </td>
                    <td>
                        <a th:href="@{/menu/edit/{id}(id=${item.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <a th:href="@{/menu/delete/{id}(id=${item.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this item?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(menuItems)}">
                    <td colspan="6" class="text-center text-muted">No menu items found. Add some items first.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
